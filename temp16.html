<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
        let users=[]
        let username=""
        let useremail=""
        let currBalance=0
        function showUser(){
            let str=""
            for(let i=0;i<users.length;i++){
                str+=`option value=`${users[i].email}`>${users[i].name}`
            }
                selUser.innerHTML=str
        }
            
        function saveData(){
            let amount=Number(document.getElementById("amount").value)
            let type=document.getElementById("type").value
            for(let i=0;i<users.length;i++){
                if(users[i].email==useremail){
            if(type=="1"){
                users[i].balance+=amount
            }
            else if(type=="2"){
                if(amount<users[i].balance){
                users[i].balance-=amount
                }
                else{
                    spBalance.innerHTML="Balance insufficient"
                    break
                }
            }
            spBalance.innerHTML=users[i].balance
        break
    }
    
}
        }
        function home(){
            let str=`
            <h2>Welcome ${username}</h2>
            <button onclick="showForm()">Log Out</button>
            <p><input type="number" id="amount" placeholder="Enter Amount"></p>
            <p><select id="type">
                <option value=0>--Select--</option>
                <option value=1>Deposit</option>
                <option value=2>Withdraw</option>
                <option value=3>Transfer</option>
                </select></p>
               <p> <select id="selUser"></select></p>
               <p><input type="number" id="amount" placeholder="Enter amount"></p>
                <button onclick='saveData()'>Submit</button>
                <p>Current Balance:<span id='spBalance'>${currBalance}</span></p>
                `;
                root.innerHTML=str
        }
        function addUser(){
            let name=document.getElementById("name").value;
            let email=document.getElementById("email").value;
            let password=document.getElementById("password").value;
            let dob=document.getElementById("dob").value;
            let user={
                name:name,
                email:email,
                password:password,
                dob:dob,
                balance:0
            };
            users.push(user)
            showLogin();
        }
        function chkUser(){
            let email=document.getElementById("email").value;
            let password=document.getElementById("password").value;
            for(let i=0;i<users.length;i++){
                if(users[i].email==email && users[i].password==password){
                    useremail=email
                    username=users[i].name
                    currBalance=users[i].balance
                    home()
                    break;
                 }
                else{
                     msg.innerHTML="Acess Denied"
        }
    }
        }
         function showForm(){
            let str=`
            <h2>Registration Form</h2>
            <input type="text" id="name" placeholder="Enter Name">
            <p><input type="email" id="email"placeholder="Enter email"></p>
            <p><input type="password" id="password"placeholder="Enter a password"></p>
            <p><input type="date" id="dob"></p>   
            <p><button onclick='addUser()'>Submit</button>
            <p>Already a member ?<button onclick="showLogin()">Log in Here</button>
            `;
            root.innerHTML=str
        }
        function showLogin(){
            let str=`
            <div>
                <h2>HDFC BANK</h2>
                <hr>
                <h2>Login Form</h2>
                <div id='msg'></div>
                <p><input id="email" type="email"></p>
                <p><input id="password" type="password"></p>
                <button onclick="chkUser()">Log In</button>
                <p><button onclick="showForm()">Create account</button></p>
            </div>
                `
        root.innerHTML=str;
        // document.write("hello world")
        }
        
    </script>
</head>
<body onload="showLogin()">
